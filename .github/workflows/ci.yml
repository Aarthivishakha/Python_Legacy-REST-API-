name: CI

on:
  push:
    branches: [PYTHON_3.11]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e .
      - run: ruff check legacy_api tests
      - run: pytest --cov=legacy_api --cov-branch tests

  analyze-compatible-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -r tool-triggers/requirements.txt
      - run: coverage run -m unittest discover -s tests
      - run: bandit -r legacy_api
      - run: radon cc legacy_api -s -a
